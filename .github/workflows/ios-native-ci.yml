name: iOS Native (Swift) TestFlight

# Builds the SwiftUI port in ios-native/ on a macos-latest runner, archives
# it, and uploads to TestFlight via xcrun altool. Two targets ship in this
# archive: the main app (com.llamascookbook.app) and the Live Activity
# widget extension (com.llamascookbook.app.widget). Each needs its own
# App Store provisioning profile.
#
# Required repo secrets:
#
#   IOS_DIST_CERT_P12_BASE64                base64 of iOS Distribution .p12
#   IOS_DIST_CERT_P12_PASSWORD              password for that .p12
#   IOS_PROVISIONING_PROFILE_BASE64         base64 of App Store .mobileprovision
#                                            for com.llamascookbook.app
#   IOS_WIDGET_PROVISIONING_PROFILE_BASE64  base64 of App Store .mobileprovision
#                                            for com.llamascookbook.app.widget
#                                            (see ROADMAP.md for setup steps)
#   IOS_SHARE_EXT_PROVISIONING_PROFILE_BASE64
#                                          base64 of App Store .mobileprovision
#                                            for com.llamascookbook.app.shareext
#                                            (see Share-Extension-Plan.md §8)
#   APPSTORE_API_KEY_P8_BASE64              base64 of AuthKey_<KEYID>.p8
#   APPSTORE_API_KEY_ID                     10-char ASC API Key ID
#   APPSTORE_API_ISSUER_ID                  ASC API issuer UUID

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload .ipa to TestFlight?
        type: boolean
        default: true

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: false

env:
  APPLE_TEAM_ID: GYFN949Q5E
  BUNDLE_ID: com.llamascookbook.app
  WIDGET_BUNDLE_ID: com.llamascookbook.app.widget
  SHARE_EXT_BUNDLE_ID: com.llamascookbook.app.shareext

jobs:
  build:
    name: Build + upload (Swift)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-native

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Pin Xcode 26 explicitly. The macos-26 runner defaults to Xcode 26,
      # but actions/runner-images installs Xcode under point-release names
      # (Xcode_26.0.1.app, Xcode_26.1.app, …), never bare Xcode_26.app —
      # and it also keeps the latest beta installed alongside (e.g.
      # Xcode_26.5_beta_2.app). Naive sort -V picks the beta because 26.5
      # > 26.4, but beta SDKs ship with a simulator-runtime build mismatch
      # that breaks actool during archive (see "Ensure iOS Simulator
      # runtime" below). Prefer stable; fall back to beta only if nothing
      # else is available. If no Xcode 26 is present at all, fail loudly
      # and dump what *is* installed so the next push can pin to it.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          shopt -s nullglob
          ALL_XCODES=( /Applications/Xcode_26*.app )
          shopt -u nullglob
          if [ ${#ALL_XCODES[@]} -eq 0 ]; then
            echo "::error::No Xcode 26.x found in /Applications. Installed Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          XCODE_APP=$(printf '%s\n' "${ALL_XCODES[@]}" | grep -vi beta | sort -V | tail -1 || true)
          if [ -z "$XCODE_APP" ]; then
            echo "::warning::No stable Xcode 26.x found; falling back to beta"
            XCODE_APP=$(printf '%s\n' "${ALL_XCODES[@]}" | sort -V | tail -1)
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          # Also export DEVELOPER_DIR via $GITHUB_ENV so it sticks for
          # every subsequent step. The macos-26 runner pre-sets
          # DEVELOPER_DIR in its shell profile pointing at the image's
          # default Xcode (currently 26.5 beta 2), which silently
          # overrides our `xcode-select` if we don't override it back.
          # That's how we ended up archiving with beta despite picking
          # stable here. Belt + suspenders.
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      # Print the full toolchain so the build log proves we're compiling
      # against the iOS 26 SDK. The `iphoneos --show-sdk-version` line is
      # the single fastest way to confirm the SDK bump took effect — if it
      # doesn't say 26.x, ITMS-90725 will not go away.
      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      # Ensure an iOS Simulator runtime with a build number matching the
      # iphonesimulator SDK is installed. Xcode 26 betas (and sometimes
      # stable point releases on the macos-26 image) ship an
      # iphonesimulator SDK whose build doesn't match any preinstalled
      # runtime, which causes actool to fail asset thinning with:
      #   error: No simulator runtime version from [...] available to
      #   use with iphonesimulator SDK version Y
      # — even on an IPHONEOS (device) archive build, where the simulator
      # should be irrelevant. Apparently actool's thinning step
      # cross-checks simulator runtimes regardless of --platform iphoneos.
      # `xcodebuild -downloadPlatform iOS` is idempotent: ~5s no-op if a
      # matching runtime is already present, ~3 min download if not.
      #
      # The `runFirstLaunch` is load-bearing: without it, the freshly
      # `xcode-select`'d Xcode hasn't registered its tooling and seeded
      # the simulator runtime catalog, and `-downloadPlatform` exits 70
      # with the misleading "Unable to connect to simulator." (the
      # daemon it's querying just hasn't been initialized yet). Retry
      # the download itself because Apple's content endpoint is flaky
      # from CI runners — three attempts with backoff covers the usual
      # transient outages without making a real failure wait forever.
      - name: Ensure iOS Simulator runtime
        run: |
          set -euo pipefail
          sudo xcodebuild -runFirstLaunch
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 30))
              echo "::warning::xcodebuild -downloadPlatform iOS attempt $attempt failed; retrying in ${wait_seconds}s"
              sleep "$wait_seconds"
            fi
          done
          echo "::error::iOS simulator runtime download failed after 3 attempts"
          xcrun simctl runtime list || true
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Decode signing assets
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_B64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXT_PROFILE_B64: ${{ secrets.IOS_SHARE_EXT_PROVISIONING_PROFILE_BASE64 }}
          KEY_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/signing/dist.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/signing/profile.mobileprovision"
          echo "$WIDGET_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/signing/widget.mobileprovision"
          echo "$SHARE_EXT_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/signing/shareext.mobileprovision"
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Create signing keychain
        env:
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          KC_PATH="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          echo "KC_PATH=$KC_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          security import "$RUNNER_TEMP/signing/dist.p12" \
            -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC_PATH" >/dev/null
          security list-keychain -d user -s "$KC_PATH" login.keychain

      - name: Install provisioning profiles
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          # Main app profile
          MAIN_SRC="$RUNNER_TEMP/signing/profile.mobileprovision"
          MAIN_PLIST=$(security cms -D -i "$MAIN_SRC")
          MAIN_UUID=$(echo "$MAIN_PLIST" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          MAIN_NAME=$(echo "$MAIN_PLIST" | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)
          cp "$MAIN_SRC" "$PROFILE_DIR/$MAIN_UUID.mobileprovision"
          echo "PROFILE_UUID=$MAIN_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$MAIN_NAME" >> "$GITHUB_ENV"
          echo "Installed main profile: $MAIN_NAME ($MAIN_UUID)"

          # Widget extension profile
          WIDGET_SRC="$RUNNER_TEMP/signing/widget.mobileprovision"
          WIDGET_PLIST=$(security cms -D -i "$WIDGET_SRC")
          WIDGET_UUID=$(echo "$WIDGET_PLIST" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          WIDGET_NAME=$(echo "$WIDGET_PLIST" | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)
          cp "$WIDGET_SRC" "$PROFILE_DIR/$WIDGET_UUID.mobileprovision"
          echo "WIDGET_PROFILE_UUID=$WIDGET_UUID" >> "$GITHUB_ENV"
          echo "WIDGET_PROFILE_NAME=$WIDGET_NAME" >> "$GITHUB_ENV"
          echo "Installed widget profile: $WIDGET_NAME ($WIDGET_UUID)"

          # Share extension profile — see Share-Extension-Plan.md §8.
          # Carries the App Group entitlement (group.com.llamascookbook.app)
          # so the extension can write to the shared inbox the main app
          # reads from.
          SHARE_EXT_SRC="$RUNNER_TEMP/signing/shareext.mobileprovision"
          SHARE_EXT_PLIST=$(security cms -D -i "$SHARE_EXT_SRC")
          SHARE_EXT_UUID=$(echo "$SHARE_EXT_PLIST" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          SHARE_EXT_NAME=$(echo "$SHARE_EXT_PLIST" | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)
          cp "$SHARE_EXT_SRC" "$PROFILE_DIR/$SHARE_EXT_UUID.mobileprovision"
          echo "SHARE_EXT_PROFILE_UUID=$SHARE_EXT_UUID" >> "$GITHUB_ENV"
          echo "SHARE_EXT_PROFILE_NAME=$SHARE_EXT_NAME" >> "$GITHUB_ENV"
          echo "Installed share extension profile: $SHARE_EXT_NAME ($SHARE_EXT_UUID)"

      - name: Generate timer alarm sound
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "Installing ffmpeg..."
            for attempt in 1 2 3; do
              if [ "$attempt" -lt 3 ]; then
                brew install ffmpeg && break
              else
                echo "::warning::Bottle download failed twice; falling back to --build-from-source"
                brew install --build-from-source ffmpeg && break
              fi
              wait_seconds=$((attempt * 30))
              echo "::warning::brew install ffmpeg attempt $attempt failed; retrying in ${wait_seconds}s"
              sleep "$wait_seconds"
            done
          fi
          mkdir -p Resources
          # Three short beeps at 880 Hz with gaps, total ~1.9s.
          # ima4-encoded .caf is Apple's preferred format for
          # UNNotificationSound — stays under the 30s notification limit
          # and loops cleanly when AVAudioPlayer replays it in-app.
          ffmpeg -y \
            -f lavfi -i "sine=frequency=880:duration=0.3" \
            -f lavfi -i "anullsrc=duration=0.15:channel_layout=mono:sample_rate=44100" \
            -f lavfi -i "sine=frequency=880:duration=0.3" \
            -f lavfi -i "anullsrc=duration=0.15:channel_layout=mono:sample_rate=44100" \
            -f lavfi -i "sine=frequency=880:duration=0.3" \
            -f lavfi -i "anullsrc=duration=0.7:channel_layout=mono:sample_rate=44100" \
            -filter_complex "[0:a][1:a][2:a][3:a][4:a][5:a]concat=n=6:v=0:a=1[out]" \
            -map "[out]" \
            -ac 1 -ar 44100 -c:a pcm_s16le \
            Resources/timer-alarm.wav
          afconvert Resources/timer-alarm.wav Resources/timer-alarm.caf -d ima4 -f caff -v
          rm Resources/timer-alarm.wav
          ls -la Resources/timer-alarm.caf

      - name: Sanitize app icon PNGs
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            echo "Installing ImageMagick..."
            brew install imagemagick
          fi
          IM=$(command -v magick || command -v convert)
          ICON_DIR="Resources/Assets.xcassets/AppIcon.appiconset"

          # Real Llamas Cookbook artwork lives at every required slot
          # under AppIcon.appiconset/. The PNGs ship as RGBA (alpha
          # channel preserved by the SVG → PNG export pipeline), but
          # Apple has always required opaque sRGB no-alpha icons —
          # Xcode 16 tolerated RGBA with a warning, Xcode 26 rejects
          # it as a hard "CompileAssetCatalogVariant thinned" archive
          # failure. We re-encode each PNG in place so the committed
          # artwork stays portable for design re-export while the
          # built bundle gets the strict format actool wants.
          #
          # Flags: -alpha off drops the alpha channel, -background
          # white composites any transparent pixels onto white (the
          # icons have a flat warm background already, so this is a
          # no-op for our artwork but keeps the conversion safe for
          # any future export with transparent corners), -colorspace
          # sRGB sets the color profile, and png:color-type=2 forces
          # an RGB (no-alpha) PNG encoding regardless of ImageMagick
          # defaults.
          shopt -s nullglob
          icons=( "$ICON_DIR"/*.png )
          if [ "${#icons[@]}" -eq 0 ]; then
            echo "::error::No PNGs in $ICON_DIR — appiconset is empty"
            exit 1
          fi

          for icon in "${icons[@]}"; do
            tmp="${icon}.opaque.png"
            "$IM" "$icon" \
              -background white -alpha remove -alpha off \
              -colorspace sRGB \
              -define png:color-type=2 \
              "$tmp"
            mv "$tmp" "$icon"
          done

          echo "Sanitized ${#icons[@]} icon PNG(s):"
          for icon in "${icons[@]}"; do
            "$IM" identify "$icon"
          done

      - name: Archive
        run: |
          set -euo pipefail
          # Unix timestamp as CFBundleVersion — always unique, always
          # monotonically increasing. Solves the collision on workflow
          # re-runs (same github.run_number would produce the same build
          # number and TestFlight rejects duplicates). Timestamps also
          # stay comfortably above any previous offset-based build numbers.
          BUILD_NUMBER=$(date -u +%s)
          echo "Using CFBundleVersion: $BUILD_NUMBER"
          # Per-target profiles — project.yml sets
          # PROVISIONING_PROFILE_SPECIFIER to $(MAIN_PROFILE_NAME) on the
          # main app target and $(WIDGET_PROFILE_NAME) on the widget.
          # xcodebuild treats these CLI args as top-level build settings
          # that those $(...) references resolve to at archive time, so
          # each target gets its own profile without any fragile global
          # override.
          # CODE_SIGN_IDENTITY="Apple Distribution" is a magic value that
          # matches either "Apple Distribution" or legacy "iPhone
          # Distribution" certs — not a guess, it's what the main app
          # was using before the widget existed.
          xcodebuild \
            -project LlamasCookbookNative.xcodeproj \
            -scheme LlamasCookbookNative \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MAIN_PROFILE_NAME="$PROFILE_NAME" \
            WIDGET_PROFILE_NAME="$WIDGET_PROFILE_NAME" \
            SHARE_EXT_PROFILE_NAME="$SHARE_EXT_PROFILE_NAME" \
            archive

      - name: Export .ipa
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
              <key>${WIDGET_BUNDLE_ID}</key>
              <string>${WIDGET_PROFILE_NAME}</string>
              <key>${SHARE_EXT_BUNDLE_ID}</key>
              <string>${SHARE_EXT_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "Built $IPA"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-ipa-${{ github.run_number }}
          path: ${{ env.IPA }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose
