name: LlamasCookbookNative
options:
  bundleIdPrefix: com.llamascookbook
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.2.0"
    # CURRENT_PROJECT_VERSION must be a Unix timestamp at archive time
    # (`date -u +%s`) — every shipped build uses that scheme, so anything
    # lower is rejected by App Store Connect. CI injects it on the
    # xcodebuild CLI; for a LOCAL archive run, after `xcodegen generate`:
    #   agvtool new-version -all $(date -u +%s)
    # (regenerating resets it to this "1" placeholder — rerun agvtool).
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: GYFN949Q5E

targets:
  LlamasCookbookNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # App Store-required privacy manifest. Declares required-reason
      # API usage (UserDefaults, file timestamps). Without this file,
      # App Store Connect auto-rejects the upload. See
      # Resources/PrivacyInfo.xcprivacy for the full declaration.
      - path: Resources/PrivacyInfo.xcprivacy
      # Push-notification body templates. CloudKit's grocery "!" alert
      # (CloudKitSubscriptions.registerGrocerySubscriptions) delivers an
      # alertLocalizationKey payload that iOS resolves against this table
      # on-device — if the file drops out of the bundle, banners show the
      # raw GROCERY_OOS_ALERT_BODY key instead of the sentence.
      - path: Resources/Localizable.strings
      # "Your Llama" seed friend recipes — bundled JSON decoded once
      # at first access by `SeedFriend.swift`. The synthetic seed
      # friend always appears at position 0 in every user's Friends
      # tab so a fresh install has something to browse / import from
      # on day one, with zero CloudKit dependency.
      - path: Resources/SeedRecipes.json
      # Hero photos for "Your Llama" seed recipes — one JPEG per recipe,
      # filename referenced by the `heroPhoto` field in `SeedRecipes.json`.
      # Folder reference so every JPEG ships flat in the app bundle and
      # `Bundle.main.url(forResource:withExtension:)` resolves without a
      # subdirectory hint. Sourced from Pexels (free commercial use,
      # attribution log in `md_files/seed-photo-credits.md`).
      - path: Resources/SeedPhotos
    dependencies:
      - target: LlamasCookbookTimerWidget
        embed: true
        codeSign: true
      - target: LlamasCookbookShareExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamascookbook.app
        PRODUCT_NAME: LlamasCookbook
        TARGETED_DEVICE_FAMILY: "1"
        # Custom Info.plist (not auto-generated) — needed because
        # CFBundleURLTypes is an array of dicts, which can't be
        # expressed via INFOPLIST_KEY_* scalar build settings. Mirrors
        # the pattern the widget extension already uses.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/AppInfo.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        # Signing — Automatic for local Xcode dev/archive (team via
        # DEVELOPMENT_TEAM). The CI fallback overrides CODE_SIGN_STYLE=Manual
        # on the xcodebuild CLI and passes $(MAIN_PROFILE_NAME) etc. as
        # top-level build settings, so the per-target specifiers below
        # resolve there and to empty (harmless) locally.
        CODE_SIGN_STYLE: Automatic
        # App Group entitlement (paired with the same on the share
        # extension target below) — see Share-Extension-Plan.md §3.
        CODE_SIGN_ENTITLEMENTS: Resources/LlamasCookbook.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(MAIN_PROFILE_NAME)"
      configs:
        # Expanded into the aps-environment entitlement at sign time —
        # Debug device runs need `development` to match Xcode's automatic
        # Development profile; Release archives must ship `production`.
        Debug:
          LC_APS_ENVIRONMENT: development
        Release:
          LC_APS_ENVIRONMENT: production

  LlamasCookbookTimerWidget:
    type: app-extension
    platform: iOS
    sources:
      # Widget UI + @main bundle
      - path: WidgetExtension
      # Shared ActivityAttributes — same Swift type used by app + widget.
      # Sources/Shared also carries SharedContainer + Base64URL for the
      # share extension; harmless extra compile in the widget target.
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamascookbook.app.widget
        PRODUCT_NAME: LlamasCookbookTimerWidget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: WidgetExtension/Info.plist
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: "$(WIDGET_PROFILE_NAME)"

  LlamasCookbookShareExtension:
    type: app-extension
    platform: iOS
    sources:
      # ShareViewController + Info.plist + entitlements
      - path: ShareExtension
      # Shared helpers — SharedContainer (App Group access),
      # Base64URL (URL-safe base64 used by the URL handoff path).
      # The share extension does NOT pull in Sources/Lib (which has
      # SwiftData / Recipe types) — by design; the extension is a
      # transparent passthrough and decodes happen in the main app.
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamascookbook.app.shareext
        PRODUCT_NAME: LlamasCookbookShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ShareExtension/Info.plist
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        # App Group entitlement — paired with the main app's. See
        # Share-Extension-Plan.md §3.
        CODE_SIGN_ENTITLEMENTS: ShareExtension/LlamasCookbookShareExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(SHARE_EXT_PROFILE_NAME)"

  LlamasCookbookNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LlamasCookbookTests
    dependencies:
      - target: LlamasCookbookNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamascookbook.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        # XcodeGen derives TEST_HOST from the target name, but the app's
        # PRODUCT_NAME is LlamasCookbook — set it explicitly or the test
        # action can't find the host binary.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LlamasCookbook.app/LlamasCookbook
        BUNDLE_LOADER: $(TEST_HOST)

# Explicit scheme so `xcodebuild test` works locally — the auto-generated
# scheme had no test action. Archive still uses Release (CI unaffected).
schemes:
  LlamasCookbookNative:
    build:
      targets:
        LlamasCookbookNative: all
    test:
      targets:
        - LlamasCookbookNativeTests
